services:
  mysql:
    image: mysql:8.0
    container_name: laundry_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laundry_db
      MYSQL_USER: laundry_user
      MYSQL_PASSWORD: laundry_pass
    ports:
      - "3307:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
      # Note: Migrations now handled by Umzug programmatically, not via docker-entrypoint-initdb.d
      # The migration runner (migrations/runner.js) runs on server startup
    networks:
      - washpos_network
    command: --default-authentication-plugin=mysql_native_password

networks:
  washpos_network:
    driver: bridge
